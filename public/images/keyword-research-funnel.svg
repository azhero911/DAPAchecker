<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.3"/>
    </pattern>
    
    <!-- Linear Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="funnel01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background Rect + Grid -->
  <rect width="1200" height="630" fill="#0B0F19"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top Decorative Glow -->
  <circle cx="600" cy="0" r="400" fill="#1E3A8A" opacity="0.25" filter="blur(80px)"/>

  <!-- Brand Badge & Header -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="5" fill="#38BDF8"/>
    <text x="28" y="18" fill="#93C5FD" font-size="12" font-weight="700" letter-spacing="0.5">DAPA METRICS Â· FRAMEWORK</text>

    <text x="0" y="68" fill="#FFFFFF" font-size="32" font-weight="800" letter-spacing="-0.5">
      The SEO Keyword Opportunity Funnel
    </text>
    <text x="0" y="96" fill="#94A3B8" font-size="16" font-weight="400">
      Filtering raw search volume into realistic, high-intent ranking opportunities (2026 Strategy)
    </text>
  </g>

  <!-- 5-Stage Funnel Container -->
  <g transform="translate(60, 168)">

    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="22" y="29" fill="#94A3B8" font-size="11" font-weight="700">STAGE 01</text>
      
      <circle cx="100" cy="74" r="26" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
      <!-- Volume Icon -->
      <path d="M 90 82 L 90 74 M 96 82 L 96 68 M 102 82 L 102 64 M 108 82 L 108 70" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>

      <text x="100" y="126" fill="#F8FAFC" font-size="16" font-weight="700" text-anchor="middle">Search Demand</text>
      <text x="100" y="146" fill="#38BDF8" font-size="12" font-weight="600" text-anchor="middle">Query Volume</text>

      <line x1="20" y1="162" x2="180" y2="162" stroke="#334155" stroke-width="1"/>

      <text x="100" y="184" fill="#94A3B8" font-size="12" text-anchor="middle">Estimate demand across</text>
      <text x="100" y="202" fill="#94A3B8" font-size="12" text-anchor="middle">seasonal datasets.</text>
      <text x="100" y="222" fill="#64748B" font-size="11" text-anchor="middle">(Treat as estimates)</text>
    </g>

    <!-- Connector 1 -->
    <path d="M 205 130 L 217 130" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="217,126 225,130 217,134" fill="#3B82F6"/>

    <!-- Stage 2 -->
    <g transform="translate(225, 0)">
      <rect width="200" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="22" y="29" fill="#94A3B8" font-size="11" font-weight="700">STAGE 02</text>
      
      <circle cx="100" cy="74" r="26" fill="#312E81" stroke="#6366F1" stroke-width="1.5"/>
      <!-- Competition Icon -->
      <path d="M 90 74 L 98 66 L 110 78" fill="none" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 96 74 L 102 70 L 110 78" fill="none" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="100" y="126" fill="#F8FAFC" font-size="16" font-weight="700" text-anchor="middle">Competition</text>
      <text x="100" y="146" fill="#818CF8" font-size="12" font-weight="600" text-anchor="middle">Tool Difficulty</text>

      <line x1="20" y1="162" x2="180" y2="162" stroke="#334155" stroke-width="1"/>

      <text x="100" y="184" fill="#94A3B8" font-size="12" text-anchor="middle">Initial screening metric.</text>
      <text x="100" y="202" fill="#94A3B8" font-size="12" text-anchor="middle">Compare domain strength.</text>
      <text x="100" y="222" fill="#64748B" font-size="11" text-anchor="middle">(Directional signal)</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 430 130 L 442 130" stroke="#6366F1" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="442,126 450,130 442,134" fill="#6366F1"/>

    <!-- Stage 3 -->
    <g transform="translate(450, 0)">
      <rect width="200" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="22" y="29" fill="#94A3B8" font-size="11" font-weight="700">STAGE 03</text>
      
      <circle cx="100" cy="74" r="26" fill="#581C87" stroke="#A855F7" stroke-width="1.5"/>
      <!-- Intent Icon (Target / Compass) -->
      <circle cx="100" cy="74" r="10" fill="none" stroke="#D8B4FE" stroke-width="2"/>
      <circle cx="100" cy="74" r="3" fill="#D8B4FE"/>

      <text x="100" y="126" fill="#F8FAFC" font-size="16" font-weight="700" text-anchor="middle">Search Intent</text>
      <text x="100" y="146" fill="#C084FC" font-size="12" font-weight="600" text-anchor="middle">User Objective</text>

      <line x1="20" y1="162" x2="180" y2="162" stroke="#334155" stroke-width="1"/>

      <text x="100" y="184" fill="#94A3B8" font-size="12" text-anchor="middle">Classify user purpose:</text>
      <text x="100" y="202" fill="#94A3B8" font-size="12" text-anchor="middle">Informational vs Tool.</text>
      <text x="100" y="222" fill="#64748B" font-size="11" text-anchor="middle">(Crucial for ranking)</text>
    </g>

    <!-- Connector 3 -->
    <path d="M 655 130 L 667 130" stroke="#A855F7" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="667,126 675,130 667,134" fill="#A855F7"/>

    <!-- Stage 4 -->
    <g transform="translate(675, 0)">
      <rect width="200" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="22" y="29" fill="#94A3B8" font-size="11" font-weight="700">STAGE 04</text>
      
      <circle cx="100" cy="74" r="26" fill="#831843" stroke="#F43F5E" stroke-width="1.5"/>
      <!-- SERP Audit Icon (Search Glass) -->
      <circle cx="97" cy="71" r="9" fill="none" stroke="#FDA4AF" stroke-width="2.5"/>
      <line x1="104" y1="78" x2="111" y2="85" stroke="#FDA4AF" stroke-width="2.5" stroke-linecap="round"/>

      <text x="100" y="126" fill="#F8FAFC" font-size="16" font-weight="700" text-anchor="middle">SERP Analysis</text>
      <text x="100" y="146" fill="#FB7185" font-size="12" font-weight="600" text-anchor="middle">Page 1 Reality</text>

      <line x1="20" y1="162" x2="180" y2="162" stroke="#334155" stroke-width="1"/>

      <text x="100" y="184" fill="#94A3B8" font-size="12" text-anchor="middle">Audit actual results:</text>
      <text x="100" y="202" fill="#94A3B8" font-size="12" text-anchor="middle">Spot thin, outdated</text>
      <text x="100" y="222" fill="#64748B" font-size="11" text-anchor="middle">or misaligned pages.</text>
    </g>

    <!-- Connector 4 -->
    <path d="M 880 130 L 892 130" stroke="#F43F5E" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="892,126 900,130 892,134" fill="#F43F5E"/>

    <!-- Stage 5 (Target!) -->
    <g transform="translate(900, 0)">
      <rect width="200" height="260" rx="12" fill="url(#targetGrad)" stroke="#10B981" stroke-width="2"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1"/>
      <text x="22" y="29" fill="#A7F3D0" font-size="11" font-weight="700">STAGE 05</text>
      
      <circle cx="100" cy="74" r="26" fill="#047857" stroke="#34D399" stroke-width="2"/>
      <!-- Checkmark Icon -->
      <path d="M 91 74 L 97 80 L 110 67" fill="none" stroke="#ECFDF5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="100" y="126" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">High Opportunity</text>
      <text x="100" y="146" fill="#6EE7B7" font-size="12" font-weight="700" text-anchor="middle">Verified Target</text>

      <line x1="20" y1="162" x2="180" y2="162" stroke="#059669" stroke-width="1"/>

      <text x="100" y="184" fill="#ECFDF5" font-size="12" font-weight="600" text-anchor="middle">Realistic to rank.</text>
      <text x="100" y="202" fill="#D1FAE5" font-size="12" text-anchor="middle">Clear content gap.</text>
      <text x="100" y="222" fill="#A7F3D0" font-size="11" font-weight="700" text-anchor="middle">High business value.</text>
    </g>

  </g>

  <!-- Bottom Comparison Banner -->
  <g transform="translate(60, 460)">
    <rect width="1080" height="120" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Left Box: Volume Trap -->
    <g transform="translate(30, 24)">
      <circle cx="16" cy="16" r="14" fill="#7F1D1D"/>
      <text x="16" y="21" fill="#FCA5A5" font-size="14" font-weight="800" text-anchor="middle">âœ•</text>
      <text x="42" y="14" fill="#F87171" font-size="14" font-weight="700">The Search Volume Trap</text>
      <text x="42" y="36" fill="#94A3B8" font-size="12">Targeting 50,000 search terms dominated by government, enterprise, and high-DA authority brands.</text>
      <text x="42" y="54" fill="#64748B" font-size="11">Result: Massive resource drain with minimal realistic ranking opportunity for small or growing sites.</text>
    </g>

    <!-- Divider -->
    <line x1="540" y1="20" x2="540" y2="100" stroke="#334155" stroke-width="1"/>

    <!-- Right Box: Opportunity Sweet Spot -->
    <g transform="translate(570, 24)">
      <circle cx="16" cy="16" r="14" fill="#064E3B"/>
      <text x="16" y="21" fill="#6EE7B7" font-size="14" font-weight="800" text-anchor="middle">âœ“</text>
      <text x="42" y="14" fill="#34D399" font-size="14" font-weight="700">The Opportunity Sweet Spot</text>
      <text x="42" y="36" fill="#94A3B8" font-size="12">Targeting 300â€“1,000 search terms where Page 1 results are thin, outdated, or misaligned with user intent.</text>
      <text x="42" y="54" fill="#A7F3D0" font-size="11">Result: Practical ranking velocity, targeted organic search traffic, and higher conversion rates.</text>
    </g>
  </g>
</svg>