<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background with subtle gradient -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <circle cx="1100" cy="100" r="300" fill="#1D4ED8" opacity="0.15"/>
  <circle cx="100" cy="530" r="250" fill="#10B981" opacity="0.1"/>

  <!-- Logo Mark -->
  <rect x="100" y="100" width="80" height="80" rx="16" fill="#1D4ED8"/>
  <path d="M120 120h20c11.046 0 20 8.954 20 20s-8.954 20-20 20h-20V120z" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="140" cy="140" r="8" fill="#10B981"/>

  <!-- Brand Name -->
  <text x="200" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">
    DAPA<tspan fill="#38BDF8"> Metrics</tspan>
  </text>

  <!-- Headline -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Bulk DA PA Checker
  </text>
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#94A3B8">
    Free Domain Authority, Page Authority &amp; Spam Score Tool
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="260" height="56" rx="28" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="30" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#38BDF8">
      ⚡ Up to 10 URLs Free
    </text>

    <!-- Pill 2 -->
    <rect x="280" y="0" width="270" height="56" rx="28" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="310" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#34D399">
      🛡️ Zero Sign-Up Required
    </text>

    <!-- Pill 3 -->
    <rect x="570" y="0" width="280" height="56" rx="28" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="600" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FBBF24">
      📊 Excel / CSV Export
    </text>
  </g>

  <!-- Bottom URL -->
  <text x="100" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#64748B">
    dapametrics.vercel.app
  </text>
</svg>
